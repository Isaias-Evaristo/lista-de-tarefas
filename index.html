<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lista de Tarefas</h1>
    </header>

    <main>
        <section>
            <h2>Nova tarefa</h2>
            <input type="text" id="campo" placeholder="Digite uma tarefa">
            <button id="botao">Adicionar</button>
        </section>

        <section>
            <h2>Minhas tarefas</h2>
            <ul id="lista"></ul>
        </section>
    </main>

    <footer>
        <p>Projeto de estudo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
